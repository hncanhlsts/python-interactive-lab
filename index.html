<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám phá Lập trình Python</title>
  
  <!-- Tailwind CSS & Monaco Editor CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.css">
  
  <!-- Pyodide Core -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>

  <style>
    * { 
      -webkit-user-select: none; 
      -ms-user-select: none; 
      user-select: none; 
    }
    .monaco-editor, .monaco-editor * { 
      -webkit-user-select: text !important; 
      -ms-user-select: text !important; 
      user-select: text !important; 
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3">
      <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 id="course-title" class="font-bold text-base md:text-lg text-emerald-400">Python Sandbox</h1>
      <span class="text-[11px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Mở khóa theo tiến độ</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="btn-reset-progress" class="text-[11px] text-slate-400 hover:text-rose-400 underline cursor-pointer">Làm lại từ đầu</button>
      <div id="runtime-status" class="text-xs text-amber-400 font-mono">Đang tải Python Runtime...</div>
    </div>
  </header>

  <!-- Bố cục chính -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1600px] mx-auto w-full">
    
    <!-- CỘT TRÁI: Lộ trình bài học -->
    <aside class="lg:col-span-4 bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col shadow-lg h-fit lg:h-[calc(100vh-5.5rem)]">
      <div class="flex items-center justify-between mb-3 border-b border-slate-700 pb-2">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Lộ trình bài học</h2>
        <span id="progress-indicator" class="text-[11px] bg-emerald-950 text-emerald-400 border border-emerald-800/80 px-2 py-0.5 rounded font-mono">0% Hoàn thành</span>
      </div>

      <!-- Danh sách bài tập -->
      <div id="lesson-accordion-list" class="space-y-3 overflow-y-auto flex-1 custom-scroll pr-1">
        <!-- Render động từ JSON -->
      </div>

      <!-- Gợi ý & Cảnh báo Anti-Paste -->
      <div class="mt-3 pt-3 border-t border-slate-700 flex flex-col">
        <div id="anti-cheat-alert" class="hidden text-xs bg-rose-950/90 border border-rose-600 text-rose-200 p-2.5 rounded-lg font-medium animate-pulse mb-2"></div>
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-slate-300">💡 Gợi ý giải quyết</span>
          <button id="btn-toggle-hint" class="text-xs text-amber-400 hover:text-amber-300 underline cursor-pointer">Xem gợi ý</button>
        </div>
        <div id="hint-box" class="hidden text-xs bg-amber-950/40 border border-amber-800/60 text-amber-200 p-2.5 rounded-lg space-y-1 mt-1.5"></div>
      </div>
    </aside>

    <!-- CỘT PHẢI: Đề bài, Editor & Terminal Console -->
    <section class="lg:col-span-8 flex flex-col gap-3 h-fit lg:h-[calc(100vh-5.5rem)]">
      
      <!-- Thẻ tóm tắt bài tập & Test Cases -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg flex flex-col md:flex-row justify-between gap-3">
        <div class="flex-1">
          <div class="flex items-center gap-2">
            <span id="current-badge" class="text-[10px] uppercase font-bold bg-emerald-950 text-emerald-300 px-2 py-0.5 rounded border border-emerald-700/60">Bài tập</span>
            <h3 id="current-title" class="font-bold text-slate-100 text-base">Đang tải bài tập...</h3>
          </div>
          <div id="current-desc" class="text-xs text-slate-300 mt-1.5 leading-relaxed">Đang tải đề bài...</div>
        </div>

        <!-- Checklist tiêu chuẩn vượt qua -->
        <div class="md:w-64 border-t md:border-t-0 md:border-l border-slate-700 md:pl-3 pt-2 md:pt-0">
          <div class="text-[11px] font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Tiêu chuẩn kiểm thử:</div>
          <div id="test-case-list" class="space-y-1 text-xs"></div>
        </div>
      </div>

      <!-- Trình soạn thảo Code Monaco -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex-1 min-h-[250px] flex flex-col">
        <div class="bg-slate-800/90 px-4 py-2 border-b border-slate-700 flex justify-between text-xs text-slate-400">
          <span class="font-mono text-emerald-400 font-bold">main.py</span>
          <span class="text-rose-400 font-semibold text-[11px]">🔒 Đã khóa tính năng dán (Paste)</span>
        </div>
        <div id="editor-container" class="flex-1 w-full"></div>
      </div>

      <!-- Nút điều khiển -->
      <div class="flex gap-2">
        <button id="btn-run" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-2 px-4 rounded-lg text-sm transition duration-200 flex items-center justify-center gap-2 shadow-md cursor-pointer">
          <span>▶</span> Chạy thử & Chấm điểm
        </button>
        <button id="btn-next-exercise" class="hidden bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-lg text-sm transition animate-bounce cursor-pointer">
          Sang bài tiếp theo ➔
        </button>
        <button id="btn-clear-console" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-xs transition cursor-pointer">
          Xóa màn hình
        </button>
        <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-xs transition cursor-pointer">
          ↺ Đặt lại code
        </button>
      </div>

      <!-- Màn hình Terminal Console bên dưới main.py -->
      <div class="bg-black/95 border border-slate-800 rounded-xl p-3 font-mono text-xs h-[180px] flex flex-col shadow-inner">
        <div class="text-slate-500 pb-1.5 border-b border-slate-800 mb-1.5 flex justify-between items-center text-[11px]">
          <span class="flex items-center gap-1.5">
            <span id="terminal-dot" class="h-2 w-2 rounded-full bg-slate-500"></span> Terminal Output
          </span>
          <span id="exec-status" class="text-slate-500">Sẵn sàng</span>
        </div>
        <div id="console-output" class="text-slate-200 whitespace-pre-wrap custom-scroll overflow-y-auto flex-1 leading-relaxed"></div>
      </div>

    </section>
  </main>

  <!-- Monaco & Pyodide Application Logic -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script>
    // Dữ liệu dự phòng mặc định (Fallback) nếu không load được curriculum.json qua fetch
    const defaultCurriculum = {
      "course_title": "Khám phá Lập trình Python (Thử - Sai)",
      "lessons": [
        {
          "lesson_id": "lesson-1",
          "lesson_title": "Bài 1: Biến, Kiểu dữ liệu & Phép toán cơ bản",
          "exercises": [
            {
              "id": "ex-1-1",
              "title": "1.1 Sửa lỗi cú pháp tính diện tích",
              "level": "Mức 1: Sửa lỗi",
              "description": "Hàm <code>tinh_dien_tich(dai, rong)</code> dưới đây đang bị thiếu dấu hai chấm <code>:</code> và lỗi thụt lề. Hãy sửa lại để hàm trả về diện tích hình chữ nhật.",
              "initial_code": "def tinh_dien_tich(dai, rong)\nreturn dai * rong",
              "hints": ["Dòng định nghĩa hàm `def` phải kết thúc bằng dấu hai chấm `:`", "Dòng lệnh `return` phải thụt lề vào 4 khoảng trắng."],
              "test_cases": [
                { "name": "Dài 5, Rộng 3 (Diện tích = 15)", "assert_code": "tinh_dien_tich(5, 3) == 15", "fail_msg": "Diện tích hình chữ nhật 5 x 3 phải bằng 15." },
                { "name": "Dài 10, Rộng 8 (Diện tích = 80)", "assert_code": "tinh_dien_tich(10, 8) == 80", "fail_msg": "Diện tích hình chữ nhật 10 x 8 phải bằng 80." }
              ]
            },
            {
              "id": "ex-1-2",
              "title": "1.2 Tính chu vi hình tròn",
              "level": "Mức 2: Tính toán số học",
              "description": "Viết hàm <code>chu_vi_tron(r)</code> tính chu vi hình tròn bán kính <code>r</code> theo công thức: <b>2 * 3.14 * r</b>.",
              "initial_code": "def chu_vi_tron(r):\n    # Viết công thức tính chu vi và trả về kết quả\n    pass",
              "hints": ["Công thức: `cv = 2 * 3.14 * r`", "Dùng `return cv` để trả về giá trị."],
              "test_cases": [
                { "name": "Bán kính r = 5", "assert_code": "round(chu_vi_tron(5), 2) == 31.4", "fail_msg": "Với r = 5, chu vi phải là 31.4." },
                { "name": "Bán kính r = 2.5", "assert_code": "round(chu_vi_tron(2.5), 2) == 15.7", "fail_msg": "Với r = 2.5, chu vi phải là 15.7." }
              ]
            },
            {
              "id": "ex-1-3",
              "title": "1.3 Ép kiểu chuỗi sang số nguyên",
              "level": "Mức 3: Chuyển đổi kiểu dữ liệu",
              "description": "Hàm <code>tong_hai_so(a_str, b_str)</code> nhận vào 2 chuỗi số. Hãy ép kiểu sang số nguyên bằng <code>int()</code> và trả về tổng của chúng.",
              "initial_code": "def tong_hai_so(a_str, b_str):\n    # Chú ý: a_str + b_str sẽ nối chuỗi chứ không cộng số\n    return a_str + b_str",
              "hints": ["Dùng `int(a_str)` để chuyển chuỗi sang số nguyên.", "Trả về: `return int(a_str) + int(b_str)`"],
              "test_cases": [
                { "name": "Cộng '12' và '8' (Tổng = 20)", "assert_code": "tong_hai_so('12', '8') == 20", "fail_msg": "'12' + '8' phải trả về số 20, không phải '128'." },
                { "name": "Cộng '100' và '250' (Tổng = 350)", "assert_code": "tong_hai_so('100', '250') == 350", "fail_msg": "Tổng của '100' và '250' phải là 350." }
              ]
            },
            {
              "id": "ex-1-4",
              "title": "1.4 Đổi phút sang giờ và phút",
              "level": "Mức 4: Toán tử chia lấy nguyên và dư",
              "description": "Viết hàm <code>doi_gio(tong_phut)</code> nhận vào số phút và trả về chuỗi theo mẫu: <code>'{gio} gio {phut} phut'</code>.",
              "initial_code": "def doi_gio(tong_phut):\n    # Dùng // lấy số giờ, % lấy số phút còn dư\n    pass",
              "hints": ["Số giờ: `gio = tong_phut // 60`", "Số phút dư: `phut = tong_phut % 60`", "Dùng f-string: `return f'{gio} gio {phut} phut'`"],
              "test_cases": [
                { "name": "130 phút", "assert_code": "doi_gio(130) == '2 gio 10 phut'", "fail_msg": "130 phút phải đổi thành '2 gio 10 phut'." },
                { "name": "45 phút", "assert_code": "doi_gio(45) == '0 gio 45 phut'", "fail_msg": "45 phút phải đổi thành '0 gio 45 phut'." }
              ]
            },
            {
              "id": "ex-1-5",
              "title": "1.5 Tạo thông điệp chào mừng",
              "level": "Mức 5: Xử lý chuỗi",
              "description": "Viết hàm <code>tao_loi_chao(ten, tuoi)</code> nhận vào <code>ten</code> (chuỗi) và <code>tuoi</code> (số nguyên), trả về chuỗi: <code>'Ban {ten} nam nay {tuoi} tuoi.'</code>",
              "initial_code": "def tao_loi_chao(ten, tuoi):\n    # Trả về câu hoàn chỉnh theo mẫu\n    pass",
              "hints": ["Dùng cú pháp f-string: `return f'Ban {ten} nam nay {tuoi} tuoi.'`"],
              "test_cases": [
                { "name": "Nam, 12 tuổi", "assert_code": "tao_loi_chao('Nam', 12) == 'Ban Nam nam nay 12 tuoi.'", "fail_msg": "Chuỗi trả về chưa đúng định dạng hoặc sai khoảng trắng." },
                { "name": "Linh, 15 tuổi", "assert_code": "tao_loi_chao('Linh', 15) == 'Ban Linh nam nay 15 tuoi.'", "fail_msg": "Kiểm tra lại dấu chấm ở cuối câu." }
              ]
            }
          ]
        },
        {
          "lesson_id": "lesson-2",
          "lesson_title": "Bài 2: Cấu trúc Rẽ nhánh (if - elif - else)",
          "exercises": [
            {
              "id": "ex-2-1",
              "title": "2.1 Tìm số lớn hơn",
              "level": "Mức 1: if - else cơ bản",
              "description": "Viết hàm <code>tim_max(a, b)</code> nhận vào 2 số và trả về số có giá trị lớn hơn.",
              "initial_code": "def tim_max(a, b):\n    if a > b:\n        return a\n    # Hoàn thiện nhánh còn lại\n",
              "hints": ["Thêm nhánh `else:` và `return b`."],
              "test_cases": [
                { "name": "a = 15, b = 7", "assert_code": "tim_max(15, 7) == 15", "fail_msg": "Số lớn hơn giữa 15 và 7 phải là 15." },
                { "name": "a = 4, b = 9", "assert_code": "tim_max(4, 9) == 9", "fail_msg": "Số lớn hơn giữa 4 và 9 phải là 9." }
              ]
            },
            {
              "id": "ex-2-2",
              "title": "2.2 Xét dấu của một số",
              "level": "Mức 2: if - elif - else",
              "description": "Viết hàm <code>xet_dau(n)</code> trả về: <code>'Duong'</code> nếu n > 0, <code>'Am'</code> nếu n < 0, và <code>'Khong'</code> nếu n == 0.",
              "initial_code": "def xet_dau(n):\n    # Dùng cấu trúc if - elif - else\n    pass",
              "hints": ["Dùng `if n > 0: return 'Duong'`", "Dùng `elif n < 0: return 'Am'`", "Nhánh `else: return 'Khong'`"],
              "test_cases": [
                { "name": "Số 10 (Dương)", "assert_code": "xet_dau(10) == 'Duong'", "fail_msg": "10 phải trả về 'Duong'." },
                { "name": "Số -5 (Âm)", "assert_code": "xet_dau(-5) == 'Am'", "fail_msg": "-5 phải trả về 'Am'." },
                { "name": "Số 0 (Không)", "assert_code": "xet_dau(0) == 'Khong'", "fail_msg": "0 phải trả về 'Khong'." }
              ]
            },
            {
              "id": "ex-2-3",
              "title": "2.3 Kiểm tra năm nhuận",
              "level": "Mức 3: Kết hợp điều kiện logic",
              "description": "Viết hàm <code>la_nam_nhuan(nam)</code> trả về <code>True</code> nếu là năm nhuận, ngược lại trả về <code>False</code>.<br><i>Năm nhuận là năm chia hết cho 400 HOẶC (chia hết cho 4 và không chia hết cho 100).</i>",
              "initial_code": "def la_nam_nhuan(nam):\n    # Viết biểu thức logic kiểm tra năm nhuận\n    pass",
              "hints": ["Dùng điều kiện: `(nam % 400 == 0) or (nam % 4 == 0 and nam % 100 != 0)`"],
              "test_cases": [
                { "name": "Năm 2024 (Năm nhuận)", "assert_code": "la_nam_nhuan(2024) is True", "fail_msg": "2024 là năm nhuận." },
                { "name": "Năm 1900 (Không nhuận)", "assert_code": "la_nam_nhuan(1900) is False", "fail_msg": "1900 chia hết cho 100 nhưng không chia hết cho 400 nên không phải năm nhuận." }
              ]
            },
            {
              "id": "ex-2-4",
              "title": "2.4 Tính tiền cước Taxi",
              "level": "Mức 4: Tính toán đa phân đoạn",
              "description": "Viết hàm <code>tien_taxi(km)</code> tính tiền cước di chuyển:<br>• 1 km đầu tiên: <b>10.000đ</b><br>• Từ km thứ 2 đến km thứ 10: <b>8.000đ/km</b><br>• Từ km thứ 11 trở đi: <b>6.000đ/km</b>",
              "initial_code": "def tien_taxi(km):\n    if km <= 1:\n        return 10000\n    elif km <= 10:\n        return 10000 + (km - 1) * 8000\n    else:\n        # Viết tiếp công thức tính tiền khi km > 10\n        pass",
              "hints": ["Khi km > 10: `return 10000 + 9 * 8000 + (km - 10) * 6000`"],
              "test_cases": [
                { "name": "1 km (10.000đ)", "assert_code": "tien_taxi(1) == 10000", "fail_msg": "1 km giá 10000." },
                { "name": "5 km (42.000đ)", "assert_code": "tien_taxi(5) == 42000", "fail_msg": "5 km = 10000 + 4 * 8000 = 42000." },
                { "name": "12 km (94.000đ)", "assert_code": "tien_taxi(12) == 94000", "fail_msg": "12 km = 10000 + 72000 + 2 * 6000 = 94000." }
              ]
            },
            {
              "id": "ex-2-5",
              "title": "2.5 Kiểm tra 3 cạnh tam giác",
              "level": "Mức 5: Điều kiện hình học",
              "description": "Viết hàm <code>la_tam_giac(a, b, c)</code> trả về <code>True</code> nếu 3 cạnh $a, b, c > 0$ tạo thành tam giác hợp lệ (tổng 2 cạnh bất kỳ luôn lớn hơn cạnh còn lại), ngược lại trả về <code>False</code>.",
              "initial_code": "def la_tam_giac(a, b, c):\n    # Kiểm tra điều kiện bất đẳng thức tam giác\n    pass",
              "hints": ["Cả 3 điều kiện phải đồng thời đúng: `a + b > c and a + c > b and b + c > a`"],
              "test_cases": [
                { "name": "Bộ ba (3, 4, 5)", "assert_code": "la_tam_giac(3, 4, 5) is True", "fail_msg": "(3, 4, 5) là tam giác hợp lệ." },
                { "name": "Bộ ba (1, 2, 3)", "assert_code": "la_tam_giac(1, 2, 3) is False", "fail_msg": "1 + 2 = 3 (không lớn hơn 3) nên không tạo thành tam giác." }
              ]
            }
          ]
        }
      ]
    };

    let curriculum = null;
    let flatExercises = [];
    let currentExercise = null;
    let pyodideInstance = null;
    let editor = null;
    let isSystemUpdating = false;

    let completedExercises = JSON.parse(localStorage.getItem('completed_python_exercises') || '[]');

    // 1. CHỐT CHẶN PASTE & COPY TOÀN DIỆN
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => e.preventDefault());

    window.addEventListener('keydown', (e) => {
      const isPaste = (e.ctrlKey || e.metaKey) && (e.key === 'v' || e.key === 'V');
      const isShiftInsert = e.shiftKey && e.key === 'Insert';
      if (isPaste || isShiftInsert) {
        e.preventDefault();
        e.stopImmediatePropagation();
        showAntiCheat("⚠️ Tính năng Paste đã bị khóa! Hãy tự tay gõ từng dòng lệnh.");
      }
    }, true);

    window.addEventListener('paste', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      showAntiCheat("⚠️ Không hỗ trợ dán mã nguồn.");
    }, true);

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopImmediatePropagation();
      showAntiCheat("⚠️ Không hỗ trợ kéo thả văn bản vào bài làm!");
    }, true);

    // 2. KHỞI TẠO MONACO EDITOR
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: '# Đang tải bài tập...',
        language: 'python',
        theme: 'vs-dark',
        fontSize: 13,
        minimap: { enabled: false },
        automaticLayout: true,
        contextmenu: false
      });

      editor.onDidChangeModelContent((e) => {
        if (isSystemUpdating) return;
        const isBulk = e.changes.some(c => c.text.length > 3 || c.text.includes('\n'));
        if (isBulk && !e.isUndoing) {
          editor.trigger('anti-cheat', 'undo', null);
          showAntiCheat("⚠️ Phát hiện hành vi chèn nhiều ký tự cùng lúc. Em hãy tự tay gõ phím!");
        }
      });

      loadCurriculum();
    });

    // 3. KHỞI TẠO PYODIDE
    async function initPyodide() {
      try {
        const consoleOut = document.getElementById('console-output');

        pyodideInstance = await loadPyodide({
          stdout: (text) => {
            consoleOut.innerText += text + "\n";
            consoleOut.scrollTop = consoleOut.scrollHeight;
          },
          stderr: (text) => {
            consoleOut.innerHTML += `<span class="text-rose-400 font-bold">${text}\n</span>`;
            consoleOut.scrollTop = consoleOut.scrollHeight;
          },
          stdin: () => {
            const userInput = window.prompt("Python đang chờ nhập dữ liệu (input):");
            if (userInput !== null) {
              consoleOut.innerText += userInput + "\n";
              consoleOut.scrollTop = consoleOut.scrollHeight;
              return userInput;
            }
            return "";
          }
        });

        document.getElementById('runtime-status').innerText = '● Python 3.11 Ready';
        document.getElementById('runtime-status').className = 'text-xs text-emerald-400 font-mono';
        document.getElementById('btn-run').disabled = false;
      } catch (err) {
        document.getElementById('runtime-status').innerText = 'Lỗi nạp Python';
        document.getElementById('runtime-status').className = 'text-xs text-rose-500 font-mono';
      }
    }
    initPyodide();

    // 4. NẠP DỮ LIỆU CÓ CƠ CHẾ DỰ PHÒNG (Fallback)
    async function loadCurriculum() {
      try {
        const res = await fetch('curriculum.json');
        if (!res.ok) throw new Error('Fetch failed');
        curriculum = await res.json();
      } catch (err) {
        console.warn("Không thể fetch curriculum.json. Sử dụng bộ dữ liệu dự phòng cục bộ.", err);
        curriculum = defaultCurriculum;
      }

      document.getElementById('course-title').innerText = curriculum.course_title;
      flatExercises = [];
      curriculum.lessons.forEach(l => {
        l.exercises.forEach(e => flatExercises.push(e));
      });

      renderLessonAccordion();

      const nextEx = flatExercises.find(e => !completedExercises.includes(e.id)) || flatExercises[0];
      if (nextEx) selectExercise(nextEx.id);
    }

    function isExerciseUnlocked(exId) {
      const idx = flatExercises.findIndex(e => e.id === exId);
      if (idx === 0) return true;
      const prevEx = flatExercises[idx - 1];
      return completedExercises.includes(prevEx.id);
    }

    function renderLessonAccordion() {
      const container = document.getElementById('lesson-accordion-list');
      container.innerHTML = '';

      curriculum.lessons.forEach((lesson) => {
        const lessonDiv = document.createElement('div');
        lessonDiv.className = 'border border-slate-700/80 rounded-xl overflow-hidden bg-slate-900/60 shadow-xs';

        let exerciseButtonsHtml = lesson.exercises.map((ex) => {
          const isCompleted = completedExercises.includes(ex.id);
          const isUnlocked = isExerciseUnlocked(ex.id);

          let statusIcon = '🔒';
          let itemStyle = 'text-slate-500 bg-slate-900/30 cursor-not-allowed opacity-60';

          if (isCompleted) {
            statusIcon = '✅';
            itemStyle = 'text-emerald-300 hover:bg-slate-800/80 cursor-pointer';
          } else if (isUnlocked) {
            statusIcon = '🔓';
            itemStyle = 'text-slate-200 hover:bg-slate-800 cursor-pointer border-slate-600';
          }

          return `
            <button id="btn-ex-${ex.id}" 
                    class="w-full text-left p-2.5 rounded-lg text-xs transition border border-transparent flex items-center justify-between ${itemStyle}" 
                    onclick="${isUnlocked ? `selectExercise('${ex.id}')` : `alertLocked()`}">
              <div class="pr-2">
                <div class="font-semibold">${ex.title}</div>
                <div class="text-[10px] text-slate-400">${ex.level}</div>
              </div>
              <span class="text-xs shrink-0">${statusIcon}</span>
            </button>
          `;
        }).join('');

        lessonDiv.innerHTML = `
          <div class="px-3.5 py-2.5 bg-slate-800 text-xs font-bold text-slate-200 flex items-center justify-between border-b border-slate-700/60">
            <span>${lesson.lesson_title}</span>
            <span class="text-[10px] text-slate-400 font-normal">${lesson.exercises.length} bài tập</span>
          </div>
          <div class="p-2 space-y-1.5">
            ${exerciseButtonsHtml}
          </div>
        `;
        container.appendChild(lessonDiv);
      });

      const progressPercent = Math.round((completedExercises.length / flatExercises.length) * 100) || 0;
      document.getElementById('progress-indicator').innerText = `${progressPercent}% Hoàn thành`;
    }

    window.alertLocked = function() {
      showAntiCheat("🔒 Bài tập đang bị khóa. Em cần hoàn thành bài tập trước đó để mở khóa!");
    };

    // 5. CHỌN BÀI TẬP
    function selectExercise(exId) {
      if (!isExerciseUnlocked(exId)) return;

      currentExercise = flatExercises.find(e => e.id === exId);
      if (!currentExercise) return;

      document.querySelectorAll('#lesson-accordion-list button').forEach(b => {
        b.classList.remove('bg-emerald-950/80', 'border-emerald-500/60', 'ring-1', 'ring-emerald-500/40');
      });
      const activeBtn = document.getElementById(`btn-ex-${exId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-emerald-950/80', 'border-emerald-500/60', 'ring-1', 'ring-emerald-500/40');
      }

      document.getElementById('current-title').innerText = currentExercise.title;
      document.getElementById('current-badge').innerText = currentExercise.level;
      document.getElementById('current-desc').innerHTML = currentExercise.description;
      document.getElementById('btn-next-exercise').classList.add('hidden');

      isSystemUpdating = true;
      editor.setValue(currentExercise.initial_code);
      isSystemUpdating = false;

      const hintBox = document.getElementById('hint-box');
      hintBox.classList.add('hidden');
      hintBox.innerHTML = currentExercise.hints.map(h => `<p>• ${h}</p>`).join('');

      const testList = document.getElementById('test-case-list');
      testList.innerHTML = currentExercise.test_cases.map((t, idx) => `
        <div id="test-row-${idx}" class="flex items-center gap-1.5 text-slate-400 text-[11px]">
          <span>⚪</span> <span class="truncate">${t.name}</span>
        </div>
      `).join('');

      document.getElementById('console-output').innerText = '';
    }

    document.getElementById('btn-toggle-hint').onclick = () => {
      document.getElementById('hint-box').classList.toggle('hidden');
    };

    // 6. THỰC THI CHẠY THỬ & CHẤM ĐIỂM
    document.getElementById('btn-run').addEventListener('click', async () => {
      if (!currentExercise || !pyodideInstance) return;

      const userCode = editor.getValue();
      const consoleOut = document.getElementById('console-output');
      const statusLabel = document.getElementById('exec-status');
      const termDot = document.getElementById('terminal-dot');

      consoleOut.innerText = '';
      statusLabel.innerText = 'Đang thực thi...';
      statusLabel.className = 'text-amber-400 font-mono text-[11px] animate-pulse';
      termDot.className = 'h-2 w-2 rounded-full bg-amber-400 animate-ping';

      const assertionsCode = currentExercise.test_cases.map((tc, idx) => `
try:
    t_${idx} = bool(${tc.assert_code})
except Exception:
    t_${idx} = False
`).join('\n');

      const testResultsArray = currentExercise.test_cases.map((_, idx) => `t_${idx}`).join(', ');

      const harness = `
result_data = {"status": "success", "tests": [], "error": None, "error_type": None}

try:
${userCode.split('\n').map(l => '    ' + l).join('\n')}

${assertionsCode.split('\n').map(l => '    ' + l).join('\n')}
    result_data["tests"] = [${testResultsArray}]

except Exception as e:
    result_data["status"] = "error"
    result_data["error"] = str(e)
    result_data["error_type"] = type(e).__name__

result_data
`;

      try {
        const pyResult = await pyodideInstance.runPythonAsync(harness);
        const res = pyResult.toJs({ dict_converter: Object.fromEntries });

        termDot.className = 'h-2 w-2 rounded-full bg-emerald-400';
        statusLabel.innerText = 'Hoàn tất';
        statusLabel.className = 'text-emerald-400 font-mono text-[11px]';

        if (res.status === 'error') {
          consoleOut.innerHTML += `<span class="text-rose-400 font-bold">\n[Lỗi ${res.error_type}]: ${res.error}</span>`;
          handleTestCasesFailUI();
        } else {
          evaluateProgress(res.tests);
        }
      } catch (err) {
        consoleOut.innerHTML += `<span class="text-rose-400 font-bold">\n[Lỗi thực thi]: ${err.message}</span>`;
        statusLabel.innerText = 'Lỗi';
        statusLabel.className = 'text-rose-400 font-mono text-[11px]';
        termDot.className = 'h-2 w-2 rounded-full bg-rose-500';
      }
    });

    function evaluateProgress(tests) {
      let allPassed = true;
      let firstFailMsg = "";

      tests.forEach((passed, idx) => {
        const row = document.getElementById(`test-row-${idx}`);
        const testDef = currentExercise.test_cases[idx];
        if (passed) {
          row.innerHTML = `<span class="text-emerald-400 font-bold">✓</span> <span class="text-emerald-300 truncate">${testDef.name}</span>`;
        } else {
          allPassed = false;
          row.innerHTML = `<span class="text-rose-500 font-bold">✗</span> <span class="text-rose-300 truncate">${testDef.name}</span>`;
          if (!firstFailMsg) firstFailMsg = testDef.fail_msg;
        }
      });

      const consoleOut = document.getElementById('console-output');

      if (allPassed) {
        consoleOut.innerHTML += `\n<span class="text-emerald-400 font-bold">🎉 CHÍNH XÁC! Bạn đã vượt qua tất cả tiêu chuẩn kiểm thử.</span>`;
        
        if (!completedExercises.includes(currentExercise.id)) {
          completedExercises.push(currentExercise.id);
          localStorage.setItem('completed_python_exercises', JSON.stringify(completedExercises));
          renderLessonAccordion();
        }

        const currentIdx = flatExercises.findIndex(e => e.id === currentExercise.id);
        if (currentIdx < flatExercises.length - 1) {
          const nextBtn = document.getElementById('btn-next-exercise');
          nextBtn.classList.remove('hidden');
          nextBtn.onclick = () => selectExercise(flatExercises[currentIdx + 1].id);
        }
      } else {
        consoleOut.innerHTML += `\n<span class="text-amber-300 font-semibold">⚠️ Chưa vượt qua: ${firstFailMsg}</span>`;
      }
    }

    function handleTestCasesFailUI() {
      currentExercise.test_cases.forEach((_, idx) => {
        const row = document.getElementById(`test-row-${idx}`);
        if (row) row.innerHTML = `<span class="text-rose-500 font-bold">✗</span> <span class="text-rose-300">Chưa đạt</span>`;
      });
    }

    document.getElementById('btn-clear-console').onclick = () => {
      document.getElementById('console-output').innerText = '';
      document.getElementById('exec-status').innerText = 'Sẵn sàng';
    };

    document.getElementById('btn-reset').onclick = () => {
      if (currentExercise) {
        isSystemUpdating = true;
        editor.setValue(currentExercise.initial_code);
        isSystemUpdating = false;
      }
    };

    document.getElementById('btn-reset-progress').onclick = () => {
      if (confirm('Bạn có chắc muốn xóa toàn bộ tiến độ làm bài để bắt đầu lại từ đầu?')) {
        localStorage.removeItem('completed_python_exercises');
        completedExercises = [];
        renderLessonAccordion();
        if (flatExercises.length > 0) selectExercise(flatExercises[0].id);
      }
    };

    function showAntiCheat(msg) {
      const alertBox = document.getElementById('anti-cheat-alert');
      alertBox.innerText = msg;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 4000);
    }
  </script>
</body>
</html>
