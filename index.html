<title>Luyện trắc nghiệm Python 10</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#F6F7F8;--card:#FFFFFF;--ink:#1B2A4A;--muted:#5A6B7B;--line:#D8DDE3;--blue:#0868E0;--green:#1E8E3E;--red:#C0392B;--orange:#C66A36;--okbg:#E8F5E9;--badbg:#FDECEA;--chip:#EEF2F7;--code:#141C2B;--codeink:#E6EDF3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1623;--card:#182233;--ink:#E6EDF3;--muted:#9FB0C3;--line:#2C3A50;--blue:#5AA2FF;--green:#4CC47A;--red:#FF7B6E;--orange:#F0A36E;--okbg:#16301F;--badbg:#3A1C1A;--chip:#223049;--code:#0B111C}}
:root[data-theme="dark"]{--bg:#0F1623;--card:#182233;--ink:#E6EDF3;--muted:#9FB0C3;--line:#2C3A50;--blue:#5AA2FF;--green:#4CC47A;--red:#FF7B6E;--orange:#F0A36E;--okbg:#16301F;--badbg:#3A1C1A;--chip:#223049;--code:#0B111C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.55rem;margin:.2em 0}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
button{font:inherit;cursor:pointer}
.mode{background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:14px;text-align:left}
.mode:hover{border-color:var(--blue)}
.mode b{display:block;font-size:1.05rem}
.mode span{color:var(--muted);font-size:.9rem}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.meta{font-size:.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stem{font-size:1.1rem;font-weight:600;margin:6px 0 10px}
pre{background:var(--code);color:var(--codeink);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:.92rem;line-height:1.45;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default;opacity:.6}
.opt .k{font-weight:800;min-width:1.2em}
.opt.right{background:var(--okbg);border-color:var(--green);opacity:1}
.opt.wrong{background:var(--badbg);border-color:var(--red);opacity:1}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;display:none}
.fb.show{display:block}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}
.primary{margin-top:14px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.ghost{margin-top:14px;margin-left:8px;background:transparent;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:8px 16px;font-weight:700}
.big{font-size:3rem;font-weight:800;color:var(--blue);margin:4px 0}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.95rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.meter{height:8px;background:var(--line);border-radius:5px;overflow:hidden;min-width:80px}
.meter>i{display:block;height:100%}
.note{font-size:.88rem;color:var(--muted);margin-top:10px}
</style>

 "Nhận biết – Thông hiểu", "ns": false}, {"n": 7, "s": "Giá trị trả về mặc định của hàm input() luôn thuộc kiểu dữ liệu nào?", "p": "", "c": "", "o": {"A": "int", "B": "float", "C": "str", "D": "bool"}, "a": "C", "e": "input() luôn trả về chuỗi (str), muốn tính toán phải ép kiểu.", "t": "Nhập/xuất", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 8, "s": "Muốn nhập số nguyên từ bàn phím gán cho biến a, câu lệnh chuẩn là gì?", "p": "", "c": "", "o": {"A": "a = int(input())", "B": "a = input(int)", "C": "a = float(input())", "D": "a = str(input())"}, "a": "A", "e": "int(input()) đọc chuỗi rồi chuyển thành số nguyên.", "t": "Nhập/xuất", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 9, "s": "Phép toán nào dùng để chia lấy phần nguyên trong Python?", "p": "", "c": "", "o": {"A": "/", "B": "%", "C": "//", "D": "^"}, "a": "C", "e": "// là chia lấy phần nguyên; / là chia thực; % là chia lấy dư.", "t": "Toán tử số học", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 10, "s": "Phép toán nào dùng để tính lũy thừa trong Python?", "p": "", "c": "", "o": {"A": "^", "B": "**", "C": "*", "D": "pow"}, "a": "B", "e": "** là lũy thừa; ^ trong Python là phép XOR bit, không phải lũy thừa.", "t": "Toán tử số học", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 11, "s": "Kết quả của biểu thức 17 % 5 bằng bao nhiêu?", "p": "", "c": "", "o": {"A": "3", "B": "2", "C": "1", "D": "0"}, "a": "B", "e": "17 = 5 × 3 + 2 nên 17 % 5 = 2.", "t": "Toán tử số học", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 12, "s": "Biến x = 4.0 thuộc kiểu dữ liệu nào sau đây?", "p": "", "c": "", "o": {"A": "int", "B": "float", "C": "str", "D": "bool"}, "a": "B", "e": "Có dấu chấm thập phân nên 4.0 là float.", "t": "Kiểu dữ liệu", "l": "Nhận biết – Thông hiểu", "ns": false}, {"n": 13, "s": "Tham số nào trong hàm print() quy định ký tự phân tách giữa các mục in?", "p": "", "c": "", "o": {"A": "end", "B": "sep", "C": "split", "D": "space"}, "a": "B", "e": "sep quy định ký tự ngăn cách giữa các gi g ≥ 80 nên kq = \"B\"; dừng ở nhánh đúng đầu tiên.", "t": "Rẽ nhánh", "l": "Vận dụng", "ns": true}, {"n": 32, "s": "Cho biến a = 15. Câu lệnh nào kiểm tra a nằm trong đoạn [10, 20]?", "p": "", "c": "", "o": {"A": "a >= 10 or a <= 20", "B": "a >= 10 and a <= 20", "C": "10 <= a or <= 20", "D": "a in 10 to 20"}, "a": "B", "e": "Đoạn [10, 20] cần cả hai điều kiện đúng nên dùng and (hoặc viết 10 <= a <= 20).", "t": "So sánh & logic", "l": "Vận dụng", "ns": false}, {"n": 33, "s": "Cho đoạn mã:", "p": "Kết quả hiển thị trên màn hình là:", "c": "a = 5\nb = 10\nif a > 3:\n    if b < 10:\n        print(\"X\")\n    else:\n        print(\"Y\")\nelse:\n    print(\"Z\")", "o": {"A": "X", "B": "Y", "C": "Z", "D": "X và Y"}, "a": "B", "e": "a > 3 đúng → vào if trong; b < 10 sai (b = 10) → else trong: Y.", "t": "If lồng nhau", "l": "Vận dụng cao", "ns": false}, {"n": 34, "s": "Cho đoạn mã:", "p": "Màn hình xuất ra giá trị gì?", "c": "m = 12\nn = 4\nans = (m // n == 3) and (m % n != 0)\nprint(ans)", "o": {"A": "True", "B": "False", "C": "3", "D": "0"}, "a": "B", "e": "12 // 4 == 3 đúng nhưng 12 % 4 = 0 nên m % n != 0 sai; True and False = False.", "t": "So sánh & logic", "l": "Vận dụng cao", "ns": false}, {"n": 35, "s": "Xem đoạn mã sau:", "p": "Kết quả xuất hiện trên màn hình là:", "c": "x = 0\nif x:\n    print(\"Co gia tri\")\nelse:\n    print(\"Rong hoac khong\")", "o": {"A": "Co gia tri", "B": "Rong hoac khong", "C": "0", "D": "Lỗi do điều kiện không phải phép so sánh"}, "a": "B", "e": "Số 0 được hiểu là False trong điều kiện, nên chạy else.", "t": "So sánh & logic", "l": "Vận dụng cao", "ns": false}, {"n": 36, "s": "Cho đoạn mã tính tiền taxi theo bậc:", "p": "Giá trị của cost in ra màn hình là:", "c": "km = 2\nif km <= 1:\n    cost = 10000\nelif km <= 3:\n    cost = 10000 + (km - 1) * 8000\nelse:\n    cost = 26000 + (km - 3) * 6000\nprint(cost)", "o": {"A": "10000", "B": "16000", "C": "18000", "D": "26000"}, "a": "C", "e": "km = 2 thuộc nhánh km <= 3: 10000 + 1 × 8000 = 18000." const st=document.getElementById('stage');
let list=[],i=0,res=[];
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){
  st.innerHTML=`<b>Chọn chế độ luyện tập</b><div class="modes">
  <button class="mode" data-m="1"><b>Phần 1</b><span>Nhận biết – Thông hiểu · câu 1–24</span></button>
  <button class="mode" data-m="2"><b>Phần 2</b><span>Vận dụng · câu 25–32</span></button>
  <button class="mode" data-m="3"><b>Phần 3</b><span>Vận dụng cao · câu 33–40</span></button>
  <button class="mode" data-m="r"><b>Đề thử 20 câu</b><span>Ngẫu nhiên từ cả 3 phần</span></button>
  <button class="mode" data-m="a"><b>Toàn bộ 40 câu</b><span>Đúng thứ tự đề cương</span></button></div>
  <p class="note">Mẹo: với câu có đoạn code, hãy lập bảng theo dõi giá trị các biến từng dòng trên giấy nháp trước khi chọn.</p>`;
  st.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.m));
}
function start(m){
  if(m==='1')list=Q.filter(q=>q.n<=24);else if(m==='2')list=Q.filter(q=>q.n>=25&&q.n<=32);
  else if(m==='3')list=Q.filter(q=>q.n>=33);else if(m==='r')list=shuffle(Q).slice(0,20).sort((a,b)=>a.n-b.n);else list=Q.slice();
  i=0;res=[];show();
}
function show(){
  if(i>=list.length)return end();
  const q=list[i],keys=q.ns?['A','B','C','D']:shuffle(['A','B','C','D']),L='ABCD';
  q._map={};keys.forEach((k,idx)=>q._map[L[idx]]=k);
  st.innerHTML=`<div class="bar"><div class="prog"><i style="width:${i/list.length*100}%"></i></div><b>${i+1}/${list.length}</b></div>
  <div class="meta">Câu ${q.n} trong đề cương · ${q.l} · ${q.t}</div>
  <div class="stem">${esc(q.s)}</div>${q.c?`<pre>${esc(q.c)}</pre>`:''}${q.p?`<div class="stem">${esc(q.p)}</div>`:''}
  <div class="opts">${L.split('').map(d=>`<button class="opt" data-d="${d}"><span class="k">${d}.</span><span>${esc(q.o[q._map[d]])}</span></button>`).join('')}</div>
  <div class="fb" id="fb"></div>`;
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b.dataset.d));
}
function pick(d){
  const q=list[i],ok=q._map[d]===q.a;res.push({q,ok});
  st.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const k=q._map[b.dataset.d];if(k===q.a)b.classList.add('right');else if(b.dataset.d===d)b.classList.add('wrong')});
  const fb=document.getElementById('fb');fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'✅ Chính xác!':'❌ Chưa đúng.'}</b> ${esc(q.e)}<br><button class="primary" id="nx">${i<list.length-1?'Câu tiếp theo →':'Xem kết quả'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;show()};document.getElementById('nx').focus();
}
function end(){
  const ok=res.filter(r=>r.ok).length,by={};
  res.forEach(r=>{const t=r.q.t;by[t]=by[t]||[0,0];by[t][1]++;if(r.ok)by[t][0]++});
  const rows=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([t,[d,n]])=>{const p=d/n;const col=p>=.8?'var(--green)':p>=.5?'var(--orange)':'var(--red)';
    return `<tr><td>${t}</td><td>${d}/${n}</td><td style="width:40%"><div class="meter"><i style="width:${p*100}%;background:${col}"></i></div></td></tr>`}).join('');
  const wrong=res.filter(r=>!r.ok).map(r=>r.q.n);
  st.innerHTML=`<div class="meta">Kết quả</div><div class="big">${ok}/${res.length}</div>
  <p>${ok/res.length>=.8?'🎉 Rất tốt! Em đã sẵn sàng cho phần trắc nghiệm.':'Hãy xem bảng dưới: các chủ đề màu đỏ, cam là chỗ cần ôn lại trước.'}</p>
  <b>Bản đồ lỗ hổng kiến thức</b><table><tr><th>Chủ đề</th><th>Đúng</th><th></th></tr>${rows}</table>
  ${wrong.length?`<p class="note">Các câu cần xem lại (số câu trong đề cương): ${wrong.join(', ')}</p>`:''}
  <button class="primary" id="again">Chọn chế độ khác</button>${wrong.length?'<button class="ghost" id="redo">Làm lại câu sai</button>':''}`;
  document.getElementById('again').onclick=home;
  const rd=document.getElementById('redo');if(rd)rd.onclick=()=>{list=Q.filter(q=>wrong.includes(q.n));i=0;res=[];show()};
}
home();
</script>
