<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khám phá Lập trình Python</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
      <h1 id="course-title" class="font-bold text-base md:text-lg text-emerald-400">Python Lab</h1>
    </div>
    <div id="runtime-status" class="text-xs text-amber-400">Đang tải Python Runtime...</div>
  </header>

  <!-- Layout 3 cột: Danh sách bài học - Chi tiết nhiệm vụ - Editor & Terminal -->
  <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 max-w-[1600px] mx-auto w-full">
    
    <!-- Cột 1: Danh sách bài học (Sidebar) -->
    <aside class="lg:col-span-3 bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col shadow-lg h-fit lg:h-full">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Lộ trình bài học</h2>
      <div id="lesson-list" class="space-y-2 overflow-y-auto max-h-[250px] lg:max-h-none flex-1">
        <!-- Render tự động từ JSON -->
      </div>
    </aside>

    <!-- Cột 2: Nhiệm vụ, Gợi ý bậc thang & Test Cases -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <!-- Thẻ đề bài -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
        <span id="lesson-level" class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Mức độ</span>
        <h2 id="lesson-title" class="text-lg font-bold mt-1 mb-2 text-white">Tiêu đề bài học</h2>
        <div id="lesson-task" class="text-sm text-slate-300 leading-relaxed">Đang tải nội dung...</div>
      </div>

      <!-- Thẻ Gợi ý & Đánh giá thử sai -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg flex-1 flex flex-col">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-sm font-bold text-slate-200 uppercase">💡 Phản hồi & Gợi ý</h3>
          <button id="btn-hint" class="text-xs text-amber-400 hover:text-amber-300 underline cursor-pointer">Xem gợi ý bậc thang</button>
        </div>

        <div id="hint-container" class="hidden mb-3 p-3 bg-amber-950/40 border border-amber-800/60 rounded-lg text-xs text-amber-300 space-y-1.5">
          <!-- Gợi ý nạp từ JSON -->
        </div>

        <div id="pedagogy-feedback" class="text-xs text-slate-400 flex-1 leading-relaxed">
          Nhấn <strong>"Chạy thử & Chấm điểm"</strong> để kiểm tra thuật toán của em.
        </div>

        <div class="mt-4 pt-3 border-t border-slate-700 text-xs">
          <div class="font-semibold text-slate-300 mb-2">Tiêu chí kiểm thử (Test Cases):</div>
          <div id="test-case-list" class="space-y-1.5">
            <!-- Render động từ JSON -->
          </div>
        </div>
      </div>
    </section>

    <!-- Cột 3: Trình soạn thảo & Terminal -->
    <section class="lg:col-span-5 flex flex-col gap-3">
      <!-- Editor -->
      <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg h-[340px] flex flex-col">
        <div class="bg-slate-800/90 px-4 py-2 border-b border-slate-700 flex justify-between text-xs text-slate-400">
          <span class="font-mono">main.py</span>
          <span>Không hỗ trợ sao chép lời giải</span>
        </div>
        <div id="editor-container" class="flex-1 w-full"></div>
      </div>

      <!-- Điều khiển -->
      <div class="flex gap-2">
        <button id="btn-run" disabled class="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-2 px-4 rounded-lg text-sm transition">
          ▶ Chạy thử & Chấm điểm
        </button>
        <button id="btn-reset" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition">
          ↺ Đặt lại
        </button>
      </div>

      <!-- Terminal -->
      <div class="bg-black/90 border border-slate-800 rounded-xl p-4 font-mono text-xs flex-1 min-h-[160px] flex flex-col shadow-inner">
        <div class="text-slate-500 pb-2 border-b border-slate-800 mb-2 flex justify-between">
          <span>Terminal Output</span>
          <span id="exec-time" class="text-[10px]"></span>
        </div>
        <pre id="console-output" class="text-slate-300 whitespace-pre-wrap overflow-y-auto flex-1"></pre>
      </div>
    </section>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <script>
    let curriculum = null;
    let currentLesson = null;
    let pyodideInstance = null;
    let editor = null;

    // 1. Khởi tạo Editor
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: '# Đang tải bài học...',
        language: 'python',
        theme: 'vs-dark',
        fontSize: 13,
        minimap: { enabled: false },
        automaticLayout: true
      });
      loadCurriculum();
    });

    // 2. Khởi tạo Pyodide
    async function initPyodide() {
      try {
        pyodideInstance = await loadPyodide();
        document.getElementById('runtime-status').innerText = '● Python Ready';
        document.getElementById('runtime-status').className = 'text-xs text-emerald-400';
        document.getElementById('btn-run').disabled = false;
      } catch (err) {
        document.getElementById('runtime-status').innerText = 'Lỗi nạp Python';
        document.getElementById('runtime-status').className = 'text-xs text-rose-500';
      }
    }
    initPyodide();

    // 3. Tải file JSON bài tập
    async function loadCurriculum() {
      try {
        const response = await fetch('curriculum.json');
        curriculum = await response.json();
        document.getElementById('course-title').innerText = curriculum.course_title;
        renderSidebar();
        if (curriculum.lessons.length > 0) {
          selectLesson(curriculum.lessons[0].id);
        }
      } catch (e) {
        console.error("Không thể nạp file curriculum.json:", e);
      }
    }

    // 4. Render danh sách bài học
    function renderSidebar() {
      const listContainer = document.getElementById('lesson-list');
      listContainer.innerHTML = '';
      curriculum.lessons.forEach((les, idx) => {
        const btn = document.createElement('button');
        btn.id = `sidebar-item-${les.id}`;
        btn.className = `w-full text-left p-3 rounded-lg text-xs transition border border-slate-700/50 bg-slate-900/60 hover:bg-slate-700/60 text-slate-300`;
        btn.innerHTML = `
          <div class="font-bold text-slate-200">Bài ${idx + 1}: ${les.title}</div>
          <div class="text-[11px] text-slate-400 mt-0.5">${les.level}</div>
        `;
        btn.onclick = () => selectLesson(les.id);
        listContainer.appendChild(btn);
      });
    }

    // 5. Chuyển đổi bài học được chọn
    function selectLesson(lessonId) {
      currentLesson = curriculum.lessons.find(l => l.id === lessonId);
      if (!currentLesson) return;

      // Đổi màu bài đang chọn
      document.querySelectorAll('#lesson-list button').forEach(b => {
        b.classList.remove('border-emerald-500', 'bg-slate-700/80');
      });
      document.getElementById(`sidebar-item-${lessonId}`).classList.add('border-emerald-500', 'bg-slate-700/80');

      // Cập nhật UI
      document.getElementById('lesson-level').innerText = currentLesson.level;
      document.getElementById('lesson-title').innerText = currentLesson.title;
      document.getElementById('lesson-task').innerHTML = currentLesson.task_description;
      editor.setValue(currentLesson.initial_code);

      // Cập nhật gợi ý
      const hintBox = document.getElementById('hint-container');
      hintBox.classList.add('hidden');
      hintBox.innerHTML = currentLesson.hints.map(h => `<p>${h}</p>`).join('');

      // Render danh sách Test Cases
      const testList = document.getElementById('test-case-list');
      testList.innerHTML = currentLesson.test_cases.map((t, idx) => `
        <div id="test-row-${idx}" class="flex items-center gap-2 text-slate-400">
          <span>⚪</span> <span>${t.name}</span>
        </div>
      `).join('');

      document.getElementById('pedagogy-feedback').innerHTML = 'Hãy đọc kỹ yêu cầu và thử sửa mã nguồn.';
      document.getElementById('console-output').innerText = '';
    }

    // Toggle Gợi ý
    document.getElementById('btn-hint').onclick = () => {
      const hintBox = document.getElementById('hint-container');
      hintBox.classList.toggle('hidden');
    };

    // 6. Thực thi code & Chấm điểm động từ JSON
    document.getElementById('btn-run').addEventListener('click', async () => {
      if (!currentLesson || !pyodideInstance) return;

      const userCode = editor.getValue();
      const consoleOut = document.getElementById('console-output');
      consoleOut.innerHTML = '<span class="text-slate-500">Đang chạy kiểm thử...</span>';

      // Tạo test harness tự động từ danh sách test_cases trong JSON
      const assertionsCode = currentLesson.test_cases.map((tc, idx) => `
    try:
        t_${idx} = bool(${tc.assert_code})
    except Exception as e:
        t_${idx} = False
`).join('\n');

      const testResultsArray = currentLesson.test_cases.map((_, idx) => `t_${idx}`).join(', ');

      const harness = `
import sys
from io import StringIO
sys_stdout_backup = sys.stdout
sys.stdout = StringIO()

result_data = {"status": "success", "stdout": "", "tests": [], "error": None, "error_type": None}

try:
${userCode.split('\n').map(l => '    ' + l).join('\n')}

${assertionsCode}
    result_data["tests"] = [${testResultsArray}]

except Exception as e:
    result_data["status"] = "error"
    result_data["error"] = str(e)
    result_data["error_type"] = type(e).__name__

result_data["stdout"] = sys.stdout.getvalue()
sys.stdout = sys_stdout_backup
result_data
`;

      try {
        const start = performance.now();
        const pyResult = await pyodideInstance.runPythonAsync(harness);
        const res = pyResult.toJs({ dict_converter: Object.fromEntries });
        const end = performance.now();

        document.getElementById('exec-time').innerText = `${Math.round(end - start)}ms`;
        consoleOut.innerText = res.stdout || '[Không có output print()]';

        if (res.status === 'error') {
          consoleOut.innerHTML += `\n<span class="text-rose-400 font-bold">${res.error_type}: ${res.error}</span>`;
          handleErrorFeedback(res.error_type, res.error);
        } else {
          handleTestResults(res.tests);
        }
      } catch (err) {
        consoleOut.innerHTML = `<span class="text-rose-400">Lỗi nghiêm trọng: ${err.message}</span>`;
      }
    });

    // 7. Cập nhật UI Test cases & Phản hồi sư phạm
    function handleTestResults(results) {
      let allPassed = true;
      let firstFailedMsg = "";

      results.forEach((passed, idx) => {
        const row = document.getElementById(`test-row-${idx}`);
        const testDef = currentLesson.test_cases[idx];
        if (passed) {
          row.innerHTML = `<span class="text-emerald-400 font-bold">✓</span> <span class="text-emerald-300">${testDef.name}</span>`;
        } else {
          allPassed = false;
          row.innerHTML = `<span class="text-rose-500 font-bold">✗</span> <span class="text-rose-300">${testDef.name}</span>`;
          if (!firstFailedMsg) firstFailedMsg = testDef.fail_msg;
        }
      });

      const feedback = document.getElementById('pedagogy-feedback');
      if (allPassed) {
        feedback.innerHTML = `<div class="p-2.5 bg-emerald-950/60 border border-emerald-700/60 rounded text-emerald-300">🎉 <strong>Rất tốt!</strong> Em đã giải quyết chính xác toàn bộ yêu cầu bài học.</div>`;
      } else {
        feedback.innerHTML = `<div class="p-2.5 bg-rose-950/50 border border-rose-800/60 rounded text-rose-300 space-y-1"><div>⚠️ <strong>Chưa đạt:</strong></div><div>${firstFailedMsg}</div></div>`;
      }
    }

    function handleErrorFeedback(type, msg) {
      const feedback = document.getElementById('pedagogy-feedback');
      let hint = `Đoạn mã dừng lại do lỗi <code>${type}</code> (${msg}).`;
      if (type === "IndentationError") hint = "Lỗi thụt lề: Các câu lệnh con bên trong hàm hoặc khối if/else cần lùi vào 4 dấu cách.";
      if (type === "SyntaxError") hint = "Lỗi cú pháp: Kiểm tra lại dấu hai chấm <code>:</code> hoặc các cặp ngoặc.";
      feedback.innerHTML = `<div class="p-2.5 bg-amber-950/50 border border-amber-800/60 rounded text-amber-300">${hint}</div>`;
    }

    // Đặt lại code ban đầu
    document.getElementById('btn-reset').onclick = () => {
      if (currentLesson) {
        editor.setValue(currentLesson.initial_code);
        selectLesson(currentLesson.id);
      }
    };
  </script>
</body>
</html>
